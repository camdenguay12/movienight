name: Enrich movie posters and details
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/camden.b64'
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch TMDB metadata
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: python scripts/enrich_movies.py
      - name: Commit enriched metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/movie-metadata.json
          git diff --cached --quiet || (git commit -m "Update movie posters and details" && git push)
