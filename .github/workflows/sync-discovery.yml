name: Refresh RamFlix discovery
on:
  schedule:
    - cron: '25 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch TMDB discovery movies
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        run: python scripts/sync_discovery.py
      - name: Publish discovery catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery.json
          git diff --cached --quiet || (git commit -m "Refresh TMDB discovery catalog" && git push)
