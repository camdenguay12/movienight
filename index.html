rap:nowrap}.nav button{white-space:nowrap;font-size:13px}.wrap{padding:15px 4%}.hero{padding:34px 20px}.stats{gap:7px}.stat{padding:12px}.stat strong{font-size:21px}.columns,.formgrid{grid-template-columns:1fr}.posters{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.poster .info{padding:7px}.poster b{font-size:12px}.detail{grid-template-columns:100px 1fr}}
 .nav button.membernav{color:#d8b5e9;display:inline-flex;align-items:center;gap:7px}.nav button.membernav.active{color:white;background:#48304f}.avatar{height:27px;width:27px;border-radius:50%;object-fit:cover;border:2px solid #bd8fae;background:#273641}.score{font-weight:750}.ratingsrow{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:9px;color:#d0d9de}.ratingsrow span{background:#20313c;border-radius:5px;padding:5px 3px;text-align:center;font-size:10px}.quote{font:italic 20px Georgia,serif!important;color:#f1d89e!important}.editrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.editrow input{width:100px}.detailbutton{padding:9px 13px;border-radius:8px;border:1px solid #536675;background:#233643;color:#fff}.danger{background:#52272c;border-color:#9b4349}.poster .info{min-height:115px;display:flex;flex-direction:column}.ratingsrow{margin-top:auto}.poster small{display:block;margin-bottom:5px}@media(max-width:700px){.avatar{width:22px;height:22px}.nav button.membernav{gap:4px}.ratingsrow{font-size:9px;flex-wrap:wrap}}  .filterbar{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px;margin:12px 0}.filterbar select{width:100%;padding:9px}.profile-camden{background-image:linear-gradient(110deg,#150d24 10%,#301b4ee0 70%,#3d2a6180),url(https://image.tmdb.org/t/p/original/5S4O9fXJm8Kc0z6c1l5G7h3f2Q0.jpg)}.profile-miles{background-image:linear-gradient(110deg,#0c2928 10%,#1d5650e0 70%,#346b6380)}.profile-john{background-image:linear-gradient(110deg,#2e0b12 10%,#651b2be0 70%,#a3413e80)}.profile-jackson{background-image:linear-gradient(110deg,#242017 10%,#605137e0 70%,#a48a5080)}.profile-kaitlyn{background-image:linear-gradient(110deg,#240e27 10%,#65306ce0 70%,#b25d8e80)}@media(max-width:850px){.filterbar{grid-template-columns:repeat(2,minmax(0,1fr))}} </style></head><body><header class="top"><div class="brand">◉ MOVIE NIGHT</div><nav class="nav" id="nav"></nav></header><main class="wrap" id="app"></main>

];let metadata={};const metaKey=f=>f.title.toLowerCase().replace(/[^\p{L}\p{N}]/gu,'')+'-'+f.year;let films;try{films=JSON.parse(localStorage.getItem('movieNightFilms'))||seeds}catch(e){films=seeds}const quotes={Camden:'Surrender Dorothy!',Miles:'Add your favorite movie quote',John:'Add your favorite movie quote',Jackson:'Add your favorite movie quote',Kaitlyn:'Add your favorite movie quote'};const avatarMovies={Camden:['Donnie Darko',2001],Miles:['Brazil',1985],John:['It',2017],Jackson:['No Country for Old Men',2007],Kaitlyn:['Terrifier 2',2022]};function avatar(m){const a=avatarMovies[m],f={title:a[0],year:a[1]};let p=metadata[metaKey(f)]?.poster;return p?'https://image.tmdb.org/t/p/w185/'+p:''}const ratingColor=v=>{let n=Math.max(0,Math.min(10,Number(v))),stops=[[0,[188,49,56]],[3,[239,64,56]],[5,[255,151,47]],[7,[255,215,69]],[9,[61,213,115]],[10,[58,195,255]]];for(let i=1;i<stops.length;i++){if(n<=stops[i][0]){let a=stops[i-1],b=stops[i],t=(n-a[0])/(b[0]-a[0]);return 'rgb('+a[1].map((v,j)=>Math.round(v+(b[1][j]-v)*t)).join(',')+')'}}return '#3ac3ff'};let page='Home',sub='Overview',selected=[...members],search='',sortBy='default',genreFilter='all',yearFilter='all',minScore='all',maxRuntime='all';const app=document.getElementById('app');const nav=document.getElementById('nav');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const watched=(f,m)=>Object.hasOwn(f.ratings,m);const avg=f=>Object.values(f.ratings).reduce((a,b)=>a+b,0)/Math.max(1,Object.values(f.ratings).length);const pic=f=>{let p=metadata[metaKey(f)]?.poster||f.poster;return p?'https://image.tmdb.org/t/p/w342/'+p:''};const save=()=>localStorage.setItem('movieNightFilms',JSON.stringify(films));function storeCamdenOverride(f){let edits=JSON.parse(localStorage.getItem('camdenEdits')||'{}');edits[metaKey(f)]={rating:Object.hasOwn(f.ratings,'Camden')?f.ratings.Camden:null,watchlist:f.watchlist.includes('Camden')};localStorage.setItem('camdenEdits',JSON.stringify(edits))}function editQuote(m){let q=prompt('Enter a favorite movie quote for '+m,localStorage.getItem('quote-'+m)||quotes[m]);if(q!==null){localStorage.setItem('quote-'+m,q.slice(0,180));render()}}function setPage(p){page=p;sub='Overview';search='';sortBy='default';genreFilter='all';yearFilter='all';minScore='all';maxRuntime='all';render();window.scrollTo(0,0)}function openAdd(m){document.getElementById('formMember').innerHTML=members.map(x=>'<option '+(x===m?'selected':'')+'>'+x+'</option>').join('');addDialog.showModal()}function updateRating(id,m){let f=films.find(x=>x.id===id);if(!f)return;let el=document.getElementById('editRating'),v=el.value;if(v.trim()===''||!Number.isFinite(Number(v))||Number(v)<0||Number(v)>10||!/^\d{1,2}(\.\d)?$/.test(v)){alert('Enter a rating from 0 to 10 with at most one decimal place.');return}f.ratings[m]=Number(v);f.watchlist=f.watchlist.filter(x=>x!==m);if(m==='Camden')storeCamdenOverride(f);save();openDetail(id);render()}function removeFromList(id,m){let f=films.find(x=>x.id===id);if(!f||!confirm('Remove '+f.title+' from '+m+'\'s lists?'))return;delete f.ratings[m];f.watchlist=f.watchlist.filter(x=>x!==m);if(m==='Camden')storeCamdenOverride(f);save();detailDialog.close();render()}function openDetail(id){let f=films.find(x=>x.id===id);if(!f)return;detailTitle.textContent=f.title;let md=metadata[metaKey(f)]||{};detailBody.innerHTML='<div class="detail"><div>'+(pic(f)?'<img src="'+pic(f)+'" alt="">':'')+'</div><div><p>'+f.year+' · '+esc(md.genre||f.genre||'Movie')+(md.runtime?' · '+md.runtime+' min':'')+'</p><p class="gold">Club average: '+(Object.keys(f.ratings).length?avg(f).toFixed(1)+'/10':'Not rated')+'</p><h3>Member ratings</h3>'+members.map(m=>'<div class="item"><span>'+m+'</span><span>'+(watched(f,m)?'★ '+f.ratings[m].toFixed(1):f.watchlist.includes(m)?'To watch':'—')+'</span></div>').join('')+'</div></div>'+(md.plot?'<p>'+esc(md.plot)+'</p>':'')+(md.cast?.length?'<p><b>Cast:</b> '+esc(md.cast.join(', '))+'</p>':'')+(md.tmdb_url?'<p><a style="color:var(--gold)" href="'+md.tmdb_url+'" target="_blank" rel="noopener">View on TMDB</a></p>':'');let m=members.includes(page)?page:'Camden';detailBody.innerHTML+='<div class="editrow"><label>Rating (0–10)<input id="editRating" type="number" min="0" max="10" step="0.1" value="'+(watched(f,m)?f.ratings[m]:'')+'" placeholder="8.5"></label><button class="detailbutton" onclick="updateRating(\''+f.id+'\',\''+m+'\')">'+(watched(f,m)?'Update rating':'Rate movie')+'</button><button class="detailbutton danger" onclick="removeFromList(\''+f.id+'\',\''+m+'\')">Remove from my lists</button></div>';detailDialog.showModal()}function poster(f){let md=metadata[metaKey(f)]||{};let imdb=md.imdb_rating||'—',rt=md.rt_score||'—',mc=md.metacritic_score||'—',tmdb=md.tmdb_rating==null?'—':Number(md.tmdb_rating).toFixed(1);return '<button class="poster" onclick="openDetail(\''+f.id+'\')">'+(pic(f)?'<img loading="lazy" src="'+pic(f)+'" alt="">':'<div style="aspect-ratio:2/3;display:grid;place-items:center;color:#8ea4b1">No poster yet</div>')+'<div class="info"><b>'+esc(f.title)+'</b><small>'+f.year+'</small><div class="score" style="color:'+(Object.keys(f.ratings).length?ratingColor(avg(f)):'#9aaeb9')+'">★ '+(Object.keys(f.ratings).length?avg(f).toFixed(1):'Unrated')+'</div><div class="ratingsrow"><span>IMDb '+esc(imdb)+'</span><span>RT '+esc(rt)+'</span><span>MC '+esc(mc)+'</span><span>TMDB '+esc(tmdb)+'</span></div></div></button>'}function filtered(arr){return arr.filter(f=>f.title.toLowerCase().includes(search.toLowerCase()))}function cards(arr){return '<div class="posters">'+(filtered(arr).map(poster).join('')||'<p class="muted">No matching movies yet.</p>')+'</div>'}function heading(t,action){return '<div class="sectionhead"><h2>'+t+'</h2>'+(action?'<button class="primary" onclick="openAdd(\''+(members.includes(page)?page:'Camden')+'\')">+ Add Movie</button>':'')+'</div>'}function searchbox(){return '<input class="search" placeholder="Search movies…" aria-label="Search movies" value="'+esc(search)+'" oninput="search=this.value;renderContent()" />'}function memberPage(){let m=page,seen=films.filter(f=>watched(f,m)).sort((a,b)=>b.ratings[m]-a.ratings[m]),todo=films.filter(f=>f.watchlist.includes(m)&&!watched(f,m));return '<section class="hero profilehero profile-'+m.toLowerCase()+'"><div class="eyebrow">Film club member</div><h1>'+m+'</h1><p class="quote">“'+esc(localStorage.getItem('quote-'+m)||quotes[m])+'”</p><button class="primary" onclick="openAdd(\''+m+'\')">+ Add Movie</button></section><div class="subnav">'+['Overview','Rated','Watchlist','Rankings'].map(x=>'<button class="'+(sub===x?'active':'')+'" onclick="sub=\''+x+'\';render()">'+x+'</button>').join('')+'</div><div class="stats"><div class="stat"><strong>'+seen.length+'</strong><span>Movies rated</span></div><div class="stat"><strong>'+(seen.length?(seen.reduce((a,f)=>a+f.ratings[m],0)/seen.length).toFixed(1):'—')+'</strong><span>Average rating</span></div><div class="stat"><strong>'+todo.length+'</strong><span>Watchlist</span></div></div><div id="content"></div>'}function memberContent(){let m=page,seen=films.filter(f=>watched(f,m)).sort((a,b)=>b.ratings[m]-a.ratings[m]),todo=films.filter(f=>f.watchlist.includes(m)&&!watched(f,m));if(sub==='Watchlist')return heading('Watchlist',true)+searchbox()+cards(todo);if(sub==='Rated')return heading('Rated Movies',true)+searchbox()+cards(seen);if(sub==='Rankings')return heading('Personal Rankings',true)+searchbox()+'<div class="panel">'+filtered(seen).map((f,i)=>'<div class="item"><button onclick="openDetail(\''+f.id+'\')">'+(i+1)+'. '+esc(f.title)+' ('+f.year+')</button><span class="score" style="color:'+ratingColor(f.ratings[m])+'">★ '+f.ratings[m].toFixed(1)+'</span></div>').join('')+'</div>';return heading('Recently Watched',true)+cards(seen.slice(0,6))+'<div class="columns"><div class="panel"><h3>Top Ranked</h3>'+seen.slice(0,8).map((f,i)=>'<div class="item"><button onclick="openDetail(\''+f.id+'\')">'+(i+1)+'. '+esc(f.title)+'</button><span class="score" style="color:'+ratingColor(f.ratings[m])+'">★ '+f.ratings[m].toFixed(1)+'</span></div>').join('')+'</div><div class="panel"><h3>Watchlist</h3>'+todo.slice(0,8).map(f=>'<div class="item"><button onclick="openDetail(\''+f.id+'\')">'+esc(f.title)+'</button><span class="muted">'+f.year+'</span></div>').join('')+'</div></div>'}function home(){return '<section class="hero"><div class="eyebrow">Five friends. Infinite films.</div><h1>Movie Night</h1><p>One home for our favorite films, personal rankings, and the next great movie night.</p><button class="primary" onclick="setPage(\'Find a Movie\')">Find Our Next Movie →</button></section><div class="stats"><div class="stat"><strong>'+films.length+'</strong><span>Movies in collection</span></div><div class="stat"><strong>'+members.length+'</strong><span>Club members</span></div><div class="stat"><strong>'+films.filter(f=>Object.keys(f.ratings).length>=2).length+'</strong><span>Shared rated films</span></div></div>'+heading('Club Favorites',false)+cards([...films].filter(f=>Object.keys(f.ratings).length>=2).sort((a,b)=>avg(b)-avg(a)).slice(0,6))+heading('Explore Members',false)+'<div class="chips">'+members.map(m=>'<button class="chip on" onclick="setPage(\''+m+'\')">'+m+' →</button>').join('')+'</div>'}function finder(){let eligible=films.filter(f=>selected.length&&selected.every(m=>!watched(f,m))&&selected.some(m=>f.watchlist.includes(m)));return '<div class="eyebrow">Group discovery</div><h1>Find a Movie</h1><p>Select who is attending. Results include films on at least one selected attendee’s watchlist that none of the selected attendees has rated.</p><div class="chips">'+members.map(m=>'<button class="chip '+(selected.includes(m)?'on':'')+'" onclick="selected=selected.includes(\''+m+'\')?selected.filter(x=>x!==\''+m+'\'):[...selected,\''+m+'\'];render()">'+(selected.includes(m)?'✓ ':'')+m+'</button>').join('')+'</div>'+heading(eligible.length+' movies for your group',false)+searchbox()+'<div id="content">'+cards(eligible)+'</div>'}function leaderboard(){let list=films.filter(f=>Object.keys(f.ratings).length>=2).sort((a,b)=>avg(b)-avg(a));return '<div class="eyebrow">The consensus</div><h1>Club Leaderboard</h1><p>Only movies rated by at least two members qualify. Ranked by the average of their personal scores.</p>'+searchbox()+'<div id="content"><div class="panel">'+filtered(list).map((f,i)=>'<div class="item"><button onclick="openDetail(\''+f.id+'\')">'+(i+1)+'. '+esc(f.title)+' ('+f.year+')</button><span><span class="gold">★ '+avg(f).toFixed(1)+'</span> <small class="muted">('+Object.keys(f.ratings).length+' ratings)</small></span></div>').join('')+'</div></div>'}function renderContent(){if(members.includes(page)){let input=document.activeElement,position=input?.classList?.contains('search')?input.selectionStart:null;document.getElementById('content').innerHTML=memberContent();if(position!==null){let next=document.querySelector('#content .search');next?.focus();next?.setSelectionRange(position,position)}}else if(page==='Find a Movie'||page==='Leaderboard'){let focus=document.activeElement;let pos=focus?.selectionStart;let old=search;app.innerHTML=page==='Find a Movie'?finder():leaderboard();let input=app.querySelector('.search');if(input&&focus?.classList.contains('search')){input.focus();input.setSelectionRange(pos,pos)}}}function render(){nav.innerHTML=['Home','Find a Movie','Leaderboard',...members].map(p=>'<button class="'+(page===p?'active ':'')+(members.includes(p)?'membernav':'')+'" onclick="setPage(\''+p+'\')">'+(members.includes(p)?'<img class="avatar" src="'+avatar(p)+'" onerror="this.style.display=\'none\'" alt="">':'')+(p==='John'?'Johny':p)+'</button>').join('');app.innerHTML=members.includes(page)?memberPage():page==='Home'?home():page==='Find a Movie'?finder():leaderboard();if(members.includes(page))renderContent();app.insertAdjacentHTML('beforeend','<footer class="foot">MOVIE NIGHT · Camden movies imported from Letterboxd. Other members currently use sample movies. New changes save only to this browser. Posters courtesy of TMDB; this product uses the TMDB API but is not endorsed or certified by TMDB.</footer>')}document.getElementById('movieForm').addEventListener('submit',e=>{e.preventDefault();let d=new FormData(e.target),title=String(d.get('title')).trim(),member=d.get('member'),status=d.get('status'),rating=String(d.get('rating'));if(!title)return;let f=films.find(f=>f.title.toLowerCase()===title.toLowerCase()&&(!d.get('year')||String(f.year)===String(d.get('year'))));if(!f){f={id:'local-'+Date.now(),title,year:Number(d.get('year'))||'',poster:'',genre:'',ratings:{},watchlist:[]};films.push(f)}if(status==='watched'){if(rating!=='')f.ratings[member]=Number(rating);f.watchlist=f.watchlist.filter(x=>x!==member)}else if(!f.watchlist.includes(member)&&!watched(f,member))f.watchlist.push(member);if(member==='Camden')storeCamdenOverride(f);save();addDialog.close();e.target.reset();render()});render();
async function loadCamden(){
 try{
  const response=await fetch('./data/camden.b64?v=3',{cache:'no-store'});if(!response.ok)throw Error('Data unavailable');
  const b64=(await response.text()).trim();
  const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
  const entries=JSON.parse(await new Response(stream).text());if(!Array.isArray(entries)||entries.length<200)throw Error('Import contains too few movies: '+entries.length);
  // Keep other members' records, but replace Camden's sample records with the real export.
  for(const f of films){delete f.ratings.Camden;f.watchlist=f.watchlist.filter(m=>m!=='Camden')}
  for(const [title,year,slug,rating] of entries){
   let f=films.find(x=>x.title.toLowerCase()===title.toLowerCase()&&Number(x.year)===year);
   if(!f){f={id:'lb-'+slug,title,year,poster:'',genre:'',ratings:{},watchlist:[],letterboxd:'https://boxd.it/'+slug};films.push(f)}
   f.letterboxd='https://boxd.it/'+slug;
   if(rating!==null){f.ratings.Camden=rating;f.watchlist=f.watchlist.filter(m=>m!=='Camden')}
   else if(!Object.hasOwn(f.ratings,'Camden')&&!f.watchlist.includes('Camden'))f.watchlist.push('Camden');
  }
  let edits=JSON.parse(localStorage.getItem('camdenEdits')||'{}');for(const f of films){let edit=edits[metaKey(f)];if(!edit)continue;if(edit.rating===null)delete f.ratings.Camden;else f.ratings.Camden=edit.rating;f.watchlist=f.watchlist.filter(m=>m!=='Camden');if(edit.watchlist)f.watchlist.push('Camden')}
  render();
  document.getElementById('importStatus')?.remove();
 }catch(e){console.error('Could not load Camden Letterboxd data',e);let el=document.getElementById('importStatus');if(!el){el=document.createElement('div');el.id='importStatus';document.querySelector('.wrap').prepend(el)}el.style.cssText='padding:14px;background:#532626;color:#fff;border-radius:8px;margin-bottom:12px';el.textContent='Camden import failed: '+e.message+' — please send this error to me.'}
}
loadCamden();
fetch('./data/movie-metadata.json?v=1',{cache:'no-store'}).then(r=>r.ok?r.json():{}).then(data=>{metadata=data;render()}).catch(console.warn);
</script></body></html>
