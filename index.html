<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movie Night | Film Club</title>
<style>
:root{color-scheme:dark;--bg:#080d11;--panel:#111c24;--line:#263743;--text:#f5f5f2;--muted:#9aaeb9;--gold:#ffca61}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:5;background:#0b151deb;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:25px;padding:17px 4%;backdrop-filter:blur(16px)}.brand{font-family:Georgia,serif;font-size:23px;letter-spacing:1px;white-space:nowrap}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button,.subnav button{background:transparent;border:0;color:var(--muted);padding:10px 12px;border-radius:8px}.nav button.active,.subnav button.active,.nav button:hover{color:white;background:#223542}.wrap{max-width:1380px;margin:auto;padding:28px 4%}.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:17px;padding:55px 35px;background:linear-gradient(95deg,#101d27 12%,#15222bdb 65%,#15222b60),url('https://image.tmdb.org/t/p/original/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg') center 43%/cover}.eyebrow{color:var(--gold);font-size:12px;letter-spacing:3px;text-transform:uppercase}h1{font:clamp(35px,6vw,65px) Georgia,serif;margin:10px 0}h2{font:27px Georgia,serif}p,.muted{color:var(--muted)}.hero p{max-width:560px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:20px}.stat strong{display:block;font-size:28px}.stat span{color:var(--muted);font-size:13px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.primary{background:var(--gold);border:0;border-radius:9px;color:#151b1f;padding:11px 16px;font-weight:750}.secondary{background:#20333f;border:1px solid #355064;border-radius:9px;color:white;padding:10px 14px}.posters{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:16px}.poster{background:#111b22;border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:left;color:white;padding:0}.poster img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#243441}.poster .info{padding:10px}.poster b{display:block;font-size:13px}.poster small{color:var(--muted)}.gold{color:var(--gold)}.columns{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-top:24px}.panel h3{margin-top:0}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item button{background:transparent;border:0;color:var(--gold);text-align:left}.subnav{display:flex;gap:8px;margin:12px 0 22px;flex-wrap:wrap}.subnav button.active{border-bottom:2px solid var(--gold)}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #425563;background:#1b2b36;color:#b7c5cf;border-radius:20px;padding:9px 14px}.chip.on{background:#3c3322;border-color:var(--gold);color:var(--gold)}.search{width:100%;max-width:430px;background:#101e27;border:1px solid #385061;color:white;border-radius:8px;padding:12px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:7px;color:var(--muted);font-size:13px}input,select{background:#0c1820;color:white;border:1px solid #385061;border-radius:8px;padding:11px;min-width:0}dialog{border:1px solid #405464;border-radius:15px;background:#101b23;color:white;max-width:650px;width:calc(100% - 25px);padding:25px}dialog::backdrop{background:#000b}.dialogtop{display:flex;justify-content:space-between;align-items:center}.close{background:transparent;color:white;border:0;font-size:25px}.detail{display:grid;grid-template-columns:145px 1fr;gap:20px}.detail img{width:100%;border-radius:8px}.foot{margin-top:50px;padding:25px 0;border-top:1px solid var(--line);color:var(--muted);font-size:12px}@media(max-width:700px){.top{display:block;padding:12px 4%}.brand{font-size:20px;margin-bottom:10px}.nav{overflow-x:auto;flex-wrap:nowrap}.nav button{white-space:nowrap;font-size:13px}.wrap{padding:15px 4%}.hero{padding:34px 20px}.stats{gap:7px}.stat{padding:12px}.stat strong{font-size:21px}.columns,.formgrid{grid-template-columns:1fr}.posters{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.poster .info{padding:7px}.poster b{font-size:12px}.detail{grid-template-columns:100px 1fr}}
</style></head><body><header class="top"><div class="brand">◉ MOVIE NIGHT</div><nav class="nav" id="nav"></nav></header><main class="wrap" id="app"></main>
<dialog id="detailDialog"><div class="dialogtop"><h2 id="detailTitle"></h2><button class="close" onclick="detailDialog.close()">×</button></div><div id="detailBody"></div></dialog>
<dialog id="addDialog"><div class="dialogtop"><h2>Add a movie</h2><button class="close" onclick="addDialog.close()">×</button></div><form id="movieForm"><div class="formgrid"><label>Movie title<input name="title" required placeholder="e.g. The Grand Budapest Hotel"></label><label>Release year<input name="year" type="number" min="1880" max="2100" placeholder="2014"></label><label>Member<select name="member" id="formMember"></select></label><label>List<select name="status"><option value="watchlist">To Watch</option><option value="watched">Watched</option></select></label><label>My rating (0–10; optional)<input name="rating" type="number" min="0" max="10" step=".1" placeholder="8.5"></label></div><p class="muted">New titles are saved in this browser for now. Shared accounts and automatic movie matching will be added when we connect a database.</p><button class="primary">Save movie</button></form></dialog>
<script>
const members=['Camden','Miles','John','Jackson','Kaitlyn'];const seeds=[
{id:'tt0816692',title:'Interstellar',year:2014,poster:'gEU2QniE6E77NI6lCU6MxlNBvIx.jpg',genre:'Science Fiction',ratings:{Camden:9.5,Miles:9.2,John:9.0},watchlist:['Jackson','Kaitlyn']},
{id:'tt0468569',title:'The Dark Knight',year:2008,poster:'qJ2tW6WMUDux911r6m7haRef0WH.jpg',genre:'Action',ratings:{Camden:9.1,John:9.4,Jackson:9.0},watchlist:['Miles']},
{id:'tt1160419',title:'Dune',year:2021,poster:'d5NXSklXo0qyIYkgV94XAgMIckC.jpg',genre:'Science Fiction',ratings:{Camden:8.5,Kaitlyn:8.9},watchlist:['Miles','John','Jackson']},
{id:'tt15398776',title:'Oppenheimer',year:2023,poster:'ptpr0kGAckfQkJeJIt8st5dglvd.jpg',genre:'Drama',ratings:{Miles:9.4,John:9.0},watchlist:['Camden','Jackson']},
{id:'tt0096283',title:'My Neighbor Totoro',year:1988,poster:'rtGDOeG9LzoerkDGZF9dnVeLppL.jpg',genre:'Animation',ratings:{Kaitlyn:9.3},watchlist:['Camden','Miles','Jackson']},
{id:'tt0110912',title:'Pulp Fiction',year:1994,poster:'d5iIlFn5s0ImszYzBPb8JPIfbXD.jpg',genre:'Crime',ratings:{Jackson:9.2,Miles:9.0},watchlist:['Kaitlyn','John']}
];let films;try{films=JSON.parse(localStorage.getItem('movieNightFilms'))||seeds}catch(e){films=seeds}let page='Home',sub='Overview',selected=[...members],search='';const app=document.getElementById('app');const nav=document.getElementById('nav');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const watched=(f,m)=>Object.hasOwn(f.ratings,m);const avg=f=>Object.values(f.ratings).reduce((a,b)=>a+b,0)/Math.max(1,Object.values(f.ratings).length);const pic=f=>f.poster?'https://image.tmdb.org/t/p/w342/'+f.poster:'';const save=()=>localStorage.setItem('movieNightFilms',JSON.stringify(films));function setPage(p){page=p;sub='Overview';search='';render();window.scrollTo(0,0)}function openAdd(m){document.getElementById('formMember').innerHTML=members.map(x=>'<option '+(x===m?'selected':'')+'>'+x+'</option>').join('');addDialog.showModal()}function openDetail(id){let f=films.find(x=>x.id===id);if(!f)return;detailTitle.textContent=f.title;detailBody.innerHTML='<div class="detail"><div>'+(f.poster?'<img src="'+pic(f)+'" alt="">':'')+'</div><div><p>'+f.year+' · '+esc(f.genre||'Movie')+'</p><p class="gold">Club average: '+(Object.keys(f.ratings).length?avg(f).toFixed(1)+'/10':'Not rated')+'</p><h3>Member ratings</h3>'+members.map(m=>'<div class="item"><span>'+m+'</span><span>'+(watched(f,m)?'★ '+f.ratings[m].toFixed(1):f.watchlist.includes(m)?'To watch':'—')+'</span></div>').join('')+'</div></div>';detailDialog.showModal()}function poster(f){return '<button class="poster" onclick="openDetail(\''+f.id+'\')">'+(f.poster?'<img loading="lazy" src="'+pic(f)+'" alt="">':'<div style="aspect-ratio:2/3;display:grid;place-items:center;color:#8ea4b1">No poster yet</div>')+'<div class="info"><b>'+esc(f.title)+'</b><small>'+f.year+'</small><div class="gold">★ '+(Object.keys(f.ratings).length?avg(f).toFixed(1):'Unrated')+'</div></div></button>'}function filtered(arr){return arr.filter(f=>f.title.toLowerCase().includes(search.toLowerCase()))}function cards(arr){return '<div class="posters">'+(filtered(arr).map(poster).join('')||'<p class="muted">No matching movies yet.</p>')+'</div>'}function heading(t,action){return '<div class="sectionhead"><h2>'+t+'</h2>'+(action?'<button class="primary" onclick="openAdd(\''+(members.includes(page)?page:'Camden')+'\')">+ Add Movie</button>':'')+'</div>'}function searchbox(){return '<input class="search" placeholder="Search movies…" aria-label="Search movies" value="'+esc(search)+'" oninput="search=this.value;renderContent()" />'}function memberPage(){let m=page,seen=films.filter(f=>watched(f,m)).sort((a,b)=>b.ratings[m]-a.ratings[m]),todo=films.filter(f=>f.watchlist.includes(m)&&!watched(f,m));return '<section class="hero"><div class="eyebrow">Film club member</div><h1>'+m+'</h1><p>Ratings, favorites and everything still on the watchlist.</p><button class="primary" onclick="openAdd(\''+m+'\')">+ Add Movie</button></section><div class="subnav">'+['Overview','Watched','To Watch','Rankings'].map(x=>'<button class="'+(sub===x?'active':'')+'" onclick="sub=\''+x+'\';render()">'+x+'</button>').join('')+'</div><div class="stats"><div class="stat"><strong>'+seen.length+'</strong><span>Movies watched</span></div><div class="stat"><strong>'+(seen.length?(seen.reduce((a,f)=>a+f.ratings[m],0)/seen.length).toFixed(1):'—')+'</strong><span>Average rating</span></div><div class="stat"><strong>'+todo.length+'</strong><span>To watch</span></div></div><div id="content"></div>'}function memberContent(){let m=page,seen=films.filter(f=>watched(f,m)).sort((a,b)=>b.ratings[m]-a.ratings[m]),todo=films.filter(f=>f.watchlist.includes(m)&&!watched(f,m));if(sub==='To Watch')return heading('To Watch',true)+searchbox()+cards(todo);if(sub==='Watched')return heading('Watched Movies',true)+searchbox()+cards(seen);if(sub==='Rankings')return heading('Personal Rankings',true)+searchbox()+'<div class="panel">'+filtered(seen).map((f,i)=>'<div class="item"><button onclick="openDetail(\''+f.id+'\')">'+(i+1)+'. '+esc(f.title)+' ('+f.year+')</button><span class="gold">★ '+f.ratings[m].toFixed(1)+'</span></div>').join('')+'</div>';return heading('Recently Watched',true)+cards(seen.slice(0,6))+'<div class="columns"><div class="panel"><h3>Top Ranked</h3>'+seen.slice(0,8).map((f,i)=>'<div class="item"><button onclick="openDetail(\''+f.id+'\')">'+(i+1)+'. '+esc(f.title)+'</button><span class="gold">★ '+f.ratings[m].toFixed(1)+'</span></div>').join('')+'</div><div class="panel"><h3>To Watch</h3>'+todo.slice(0,8).map(f=>'<div class="item"><button onclick="openDetail(\''+f.id+'\')">'+esc(f.title)+'</button><span class="muted">'+f.year+'</span></div>').join('')+'</div></div>'}function home(){return '<section class="hero"><div class="eyebrow">Five friends. Infinite films.</div><h1>Movie Night</h1><p>One home for our favorite films, personal rankings, and the next great movie night.</p><button class="primary" onclick="setPage(\'Find a Movie\')">Find Our Next Movie →</button></section><div class="stats"><div class="stat"><strong>'+films.length+'</strong><span>Movies in collection</span></div><div class="stat"><strong>'+members.length+'</strong><span>Club members</span></div><div class="stat"><strong>'+films.filter(f=>Object.keys(f.ratings).length>=2).length+'</strong><span>Shared rated films</span></div></div>'+heading('Club Favorites',false)+cards([...films].filter(f=>Object.keys(f.ratings).length>=2).sort((a,b)=>avg(b)-avg(a)).slice(0,6))+heading('Explore Members',false)+'<div class="chips">'+members.map(m=>'<button class="chip on" onclick="setPage(\''+m+'\')">'+m+' →</button>').join('')+'</div>'}function finder(){let eligible=films.filter(f=>selected.length&&selected.every(m=>!watched(f,m))&&selected.some(m=>f.watchlist.includes(m)));return '<div class="eyebrow">Group discovery</div><h1>Find a Movie</h1><p>Select who is attending. Results include films on at least one selected attendee’s watchlist that none of the selected attendees has rated.</p><div class="chips">'+members.map(m=>'<button class="chip '+(selected.includes(m)?'on':'')+'" onclick="selected=selected.includes(\''+m+'\')?selected.filter(x=>x!==\''+m+'\'):[...selected,\''+m+'\'];render()">'+(selected.includes(m)?'✓ ':'')+m+'</button>').join('')+'</div>'+heading(eligible.length+' movies for your group',false)+searchbox()+'<div id="content">'+cards(eligible)+'</div>'}function leaderboard(){let list=films.filter(f=>Object.keys(f.ratings).length>=2).sort((a,b)=>avg(b)-avg(a));return '<div class="eyebrow">The consensus</div><h1>Club Leaderboard</h1><p>Only movies rated by at least two members qualify. Ranked by the average of their personal scores.</p>'+searchbox()+'<div id="content"><div class="panel">'+filtered(list).map((f,i)=>'<div class="item"><button onclick="openDetail(\''+f.id+'\')">'+(i+1)+'. '+esc(f.title)+' ('+f.year+')</button><span><span class="gold">★ '+avg(f).toFixed(1)+'</span> <small class="muted">('+Object.keys(f.ratings).length+' ratings)</small></span></div>').join('')+'</div></div>'}function renderContent(){if(members.includes(page)){document.getElementById('content').innerHTML=memberContent()}else if(page==='Find a Movie'||page==='Leaderboard'){let focus=document.activeElement;let pos=focus?.selectionStart;let old=search;app.innerHTML=page==='Find a Movie'?finder():leaderboard();let input=app.querySelector('.search');if(input&&focus?.classList.contains('search')){input.focus();input.setSelectionRange(pos,pos)}}}function render(){nav.innerHTML=['Home',...members,'Find a Movie','Leaderboard'].map(p=>'<button class="'+(page===p?'active':'')+'" onclick="setPage(\''+p+'\')">'+p+'</button>').join('');app.innerHTML=members.includes(page)?memberPage():page==='Home'?home():page==='Find a Movie'?finder():leaderboard();if(members.includes(page))renderContent();app.insertAdjacentHTML('beforeend','<footer class="foot">MOVIE NIGHT · Prototype with sample movies. Changes currently save only to this browser. Posters courtesy of TMDB; this product uses the TMDB API but is not endorsed or certified by TMDB.</footer>')}document.getElementById('movieForm').addEventListener('submit',e=>{e.preventDefault();let d=new FormData(e.target),title=String(d.get('title')).trim(),member=d.get('member'),status=d.get('status'),rating=String(d.get('rating'));if(!title)return;let f=films.find(f=>f.title.toLowerCase()===title.toLowerCase()&&(!d.get('year')||String(f.year)===String(d.get('year'))));if(!f){f={id:'local-'+Date.now(),title,year:Number(d.get('year'))||'',poster:'',genre:'',ratings:{},watchlist:[]};films.push(f)}if(status==='watched'){if(rating!=='')f.ratings[member]=Number(rating);f.watchlist=f.watchlist.filter(x=>x!==member)}else if(!f.watchlist.includes(member)&&!watched(f,member))f.watchlist.push(member);save();addDialog.close();e.target.reset();render()});render();
</script></body></html>
