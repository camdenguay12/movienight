/* Cinema-inspired accents and stronger separation */
:root{--panel:#172732;--line:#385063;--gold:#f4c66e}
.stat,.panel,.seenfilter,.poster,.findrow,.ratedlist,.findlist{background:linear-gradient(145deg,#1c303e,#15242f);border-color:#41586a;box-shadow:0 8px 24px #050b1230}
.stat{border-top:3px solid #c69b56}.stat:nth-child(2){border-top-color:#76b5ad}.stat:nth-child(3){border-top-color:#b18dc6}
.stat strong{color:#ffe1a5}
.panel h3,.sectionhead h2{color:#f7e2bf}
.poster:hover,.ratedrow:hover,.findrow:hover{border-color:#c49b65;background:#263b48}
.ratedrow,.findlist .findrow{background:linear-gradient(90deg,#1a2c39,#192833)}
.ratedrow:nth-child(even),.findlist .findrow:nth-child(even){background:linear-gradient(90deg,#213542,#1a2c38)}
.filterbar select,.userpicker select,select,input,.search{background:#213744;border:1px solid #638095;color:#f7f5ef;box-shadow:inset 0 1px 2px #07111a40}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid #f4c66e;outline-offset:2px}
.chip,.viewtoggle button,.secondary{background:#243a49;border-color:#557185;color:#e2ebee}
.chip.on,.viewtoggle button.active,.subnav button.active{background:#4c3a2b;border-color:#e4b970;color:#ffe3a7}
.ratingsrow span,.pubscore{display:inline-flex;align-items:center;justify-content:center;border-radius:6px;padding:4px 7px;font-size:11px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.ratingsrow .imdb,.pubscore.imdb{background:#51421d;color:#ffe08a;border-color:#8b722d}

me','Find a Movie'].map(p=>'<button class="'+(page===p?'active':'')+'" onclick="setPage(\''+p+'\')">'+p+'</button>').join('')+'<span class="dailyquote" id="dailyQuote"></span><label class="userpicker"><span>Select User</span><select aria-label="Select user" onchange="if(this.value){if(activeMember)setPage(this.value);else chooseProfile(this.value)}"><option value="">Choose a member…</option>'+members.map(m=>'<option value="'+m+'" '+(page===m?'selected':'')+'>'+(m==='John'?'Johny':m)+'</option>').join('')+'</select></label>';document.getElementById('dailyQuote').textContent=dailyMovieQuote();app.innerHTML=members.includes(page)?memberPage():page==='Home'?home():page==='Find a Movie'?finder():leaderboard();if(members.includes(page))renderContent();app.insertAdjacentHTML('beforeend','<footer class="foot">MOVIE NIGHT · Camden movies imported from Letterboxd. Other members currently use sample movies. '+(liveReady?'Changes sync through Ramsgate Movie Data.':'Changes are local until live sync connects.')+' Posters courtesy of TMDB; this product uses the TMDB API but is not endorsed or certified by TMDB.</footer>')}document.getElementById('movieForm').addEventListener('submit',e=>{e.preventDefault();let d=new FormData(e.target),title=String(d.get('title')).trim(),member=d.get('member'),status=d.get('status'),rating=String(d.get('rating'));if(!title||!requireOwner(member))return;let f=films.find(f=>f.title.toLowerCase()===title.toLowerCase()&&(!d.get('year')||String(f.year)===String(d.get('year'))));if(!f){f={id:'local-'+Date.now(),title,year:Number(d.get('year'))||'',poster:'',genre:'',ratings:{},watchlist:[]};films.push(f)}if(status==='watched'){if(rating!=='')f.ratings[member]=Number(rating);f.watchlist=f.watchlist.filter(x=>x!==member)}else if(!f.watchlist.includes(member)&&!watched(f,member))f.watchlist.push(member);if(member==='Camden')storeCamdenOverride(f);saveListChange(f,member);addDialog.close();e.target.reset();chooseAddList('watchlist');render();schedulePosterLookup()});restoreView();render();loadAuthStatus().then(()=>{renderProfiles();let stored=null;try{stored=JSON.parse(sessionStorage.getItem('movieNightSession')||'null')}catch(e){}if(stored&&members.includes(stored.member)&&stored.token){activeMember=stored.member;authToken=stored.token;document.getElementById('authGate').hidden=true;if(!restoreView())page=activeMember;render()}});
async function loadCamden(){
 try{
  const response=await fetch('./data/camden.b64?v=3',{cache:'no-store'});if(!response.ok)throw Error('Data unavailable');
  const b64=(await response.text()).trim();
  const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
  const entries=JSON.parse(await new Response(stream).text());if(!Array.isArray(entries)||entries.length<200)throw Error('Import contains too few movies: '+entries.length);
  // Keep other members' records, but replace Camden's sample records with the real export.
  for(const f of films){delete f.ratings.Camden;f.watchlist=f.watchlist.filter(m=>m!=='Camden')}
  for(const [title,year,slug,rating] of entries){
   let f=films.find(x=>x.title.toLowerCase()===title.toLowerCase()&&Number(x.year)===year);
   if(!f){f={id:'lb-'+slug,title,year,poster:'',genre:'',ratings:{},watchlist:[],letterboxd:'https://boxd.it/'+slug};films.push(f)}
   f.letterboxd='https://boxd.it/'+slug;
   if(rating!==null){f.ratings.Camden=rating;f.watchlist=f.watchlist.filter(m=>m!=='Camden')}
   else if(!Object.hasOwn(f.ratings,'Camden')&&!f.watchlist.includes('Camden'))f.watchlist.push('Camden');
  }
  let edits=JSON.parse(localStorage.getItem('camdenEdits')||'{}');for(const f of films){let edit=edits[metaKey(f)];if(!edit)continue;if(edit.rating===null)delete f.ratings.Camden;else f.ratings.Camden=edit.rating;f.watchlist=f.watchlist.filter(m=>m!=='Camden');if(edit.watchlist)f.watchlist.push('Camden')}
  render();
  document.getElementById('importStatus')?.remove();
 }catch(e){console.error('Could not load Camden Letterboxd data',e);let el=document.getElementById('importStatus');if(!el){el=document.createElement('div');el.id='importStatus';document.querySelector('.wrap').prepend(el)}el.style.cssText='padding:14px;background:#532626;color:#fff;border-radius:8px;margin-bottom:12px';el.textContent='Camden import failed: '+e.message+' — please send this error to me.'}
}
if(LIVE_ENDPOINT){loadLive();setInterval(loadLive,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadLive()})}else loadCamden();
(function(){let pending=false;function updateTheater(){pending=false;const hero=document.querySelector('.homehero');if(!hero||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const rect=hero.getBoundingClientRect();const progress=Math.max(0,Math.min(1,-rect.top/Math.max(rect.height,1)));hero.style.setProperty('--theater-shift',Math.round(progress*110)+'px')}addEventListener('scroll',()=>{if(!pending){pending=true;requestAnimationFrame(updateTheater)}},{passive:true});addEventListener('resize',updateTheater);updateTheater()})();
async function loadFeaturedPosters(){for(const [title,year,key] of [['Hokum',2026,'Hokum'],['Hoppers',2026,'Jess']]){try{const response=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(title)+'&entity=movie&limit=25');const data=await response.json();const hit=data.results?.find(x=>x.trackName?.toLowerCase()===title.toLowerCase()&&new Date(x.releaseDate).getUTCFullYear()===year);if(!hit?.artworkUrl100)continue;externalPosters[key]=hit.artworkUrl100.replace(/100x100bb/g,'600x900bb');externalPosters[title.toLowerCase()+'-'+year]=externalPosters[key];render()}catch(e){console.warn('Featured poster lookup unavailable',e)}}}
loadFeaturedPosters();
const posterAttempts=new Set();let posterLookupTimer=null,posterLookupBusy=false;
function schedulePosterLookup(){if(posterLookupTimer)return;posterLookupTimer=setTimeout(()=>{posterLookupTimer=null;fillMissingPosters()},700)}
const movieTitleAliases={'seven':'se7en','se7en':'seven','shawshank redemption':'the shawshank redemption','the shawshank redemption':'shawshank redemption'};
const normalizeMovieTitle=t=>String(t||'').toLowerCase().replace(/[^a-z0-9]/g,'');
async function fillMissingPosters(){
 if(posterLookupBusy)return;posterLookupBusy=true;
 try{
  const missing=films.filter(f=>!pic(f)&&!posterAttempts.has(metaKey(f))&&f.title).slice(0,35);
  for(const f of missing){
   const key=metaKey(f);posterAttempts.add(key);
   try{
    const query=movieTitleAliases[f.title.toLowerCase()]||f.title;
    const res=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(query)+'&entity=movie&limit=100');
    if(!res.ok)throw Error('Movie lookup '+res.status);
    const json=await res.json();
    const valid=[normalizeMovieTitle(f.title),normalizeMovieTitle(query)];
    const matches=(json.results||[]).filter(x=>valid.includes(normalizeMovieTitle(x.trackName))&&(!Number(f.year)||Math.abs(new Date(x.releaseDate).getUTCFullYear()-Number(f.year))<=1));
    const match=matches.sort((x,y)=>Math.abs(new Date(x.releaseDate).getUTCFullYear()-Number(f.year))-Math.abs(new Date(y.releaseDate).getUTCFullYear()-Number(f.year)))[0];
    if(match){
     const record=metadata[key]||{};
     if(match.artworkUrl100&&!record.poster){const url=match.artworkUrl100.replace(/100x100bb/g,'600x900bb');externalPosters[key]=url;f.poster=url;if(liveReady)liveWrite({action:'poster',movieId:f.id,posterUrl:url})}
     metadata[key]={...record,genre:record.genre||match.primaryGenreName||'',runtime:record.runtime||Math.round((match.trackTimeMillis||0)/60000)||null,plot:record.plot||match.longDescription||match.shortDescription||''};
     save();render();
    }
   }catch(e){posterAttempts.delete(key);console.warn('Movie lookup failed for',f.title,e)}
  }
 }finally{posterLookupBusy=false}
}
setTimeout(schedulePosterLookup,2500);setInterval(()=>fetch('./data/movie-metadata.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(data=>{if(data){metadata={...metadata,...data};render();schedulePosterLookup()}}).catch(console.warn),15*60*1000);
fetch('./data/movie-metadata.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():{}).then(data=>{metadata=data;resolveMissingTitles();render();if(!activeMember)renderProfiles();schedulePosterLookup()}).catch(console.warn);
</script></body></html>
