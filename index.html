function leaderboard(){let list=films.filter(f=>Object.keys(f.ratings).length>=2).sort((a,b)=>avg(b)-avg(a));return '<div class="eyebrow">The consensus</div><h1>Club Leaderboard</h1><p>Only movies rated by at least two members qualify. Ranked by the average of their personal scores.</p>'+searchbox()+'<div id="content"><div class="panel">'+filtered(list).map((f,i)=>'<div class="item"><button onclick="openDetail(\''+f.id+'\')">'+(i+1)+'. '+esc(f.title)+' ('+f.year+')</button><span><span class="gold">★ '+avg(f).toFixed(1)+'</span> <small class="muted">('+Object.keys(f.ratings).length+' ratings)</small></span></div>').join('')+'</div></div>'}function renderContent(){if(members.includes(page)){let input=document.activeElement,position=input?.classList?.contains('search')?input.selectionStart:null;document.getElementById('content').innerHTML=memberContent();if(position!==null){let next=document.querySelector('#content .search');next?.focus();next?.setSelectionRange(position,position)}}else if(page==='Home'){document.getElementById('leaderboardContent').innerHTML=leaderboardRows()}else if(page==='Find a Movie'){let input=document.activeElement,position=input?.classList?.contains('search')?input.selectionStart:null;document.getElementById('content').innerHTML=finderResults();if(position!==null){let next=document.querySelector('.search');next?.focus();next?.setSelectionRange(position,position)}}}function dailyMovieQuote(){const quotes=['“May the Force be with you.” — Star Wars','“There’s no place like home.” — The Wizard of Oz','“Here’s looking at you, kid.” — Casablanca','“You’re gonna need a bigger boat.” — Jaws','“To infinity and beyond!” — Toy Story','“Just keep swimming.” — Finding Nemo','“Life is like a box of chocolates.” — Forrest Gump','“I’ll be back.” — The Terminator','“Why so serious?” — The Dark Knight','“Carpe diem. Seize the day.” — Dead Poets Society'];return quotes[Math.floor(Date.now()/86400000)%quotes.length]}function render(){nav.innerHTML=['Home','Find a Movie'].map(p=>'<button class="'+(page===p?'active':'')+'" onclick="setPage(\''+p+'\')">'+p+'</button>').join('')+'<span class="dailyquote" id="dailyQuote"></span><label class="userpicker"><span>Select User</span><select aria-label="Select user" onchange="if(this.value)setPage(this.value)"><option value="">Choose a member…</option>'+members.map(m=>'<option value="'+m+'" '+(page===m?'selected':'')+'>'+(m==='John'?'Johny':m)+'</option>').join('')+'</select></label>';document.getElementById('dailyQuote').textContent=dailyMovieQuote();app.innerHTML=members.includes(page)?memberPage():page==='Home'?home():page==='Find a Movie'?finder():leaderboard();if(members.includes(page))renderContent();app.insertAdjacentHTML('beforeend','<footer class="foot">MOVIE NIGHT · Camden movies imported from Letterboxd. Other members currently use sample movies. '+(liveReady?'Changes sync through Ramsgate Movie Data.':'Changes are local until live sync connects.')+' Posters courtesy of TMDB; this product uses the TMDB API but is not endorsed or certified by TMDB.</footer>')}document.getElementById('movieForm').addEventListener('submit',e=>{e.preventDefault();let d=new FormData(e.target),title=String(d.get('title')).trim(),member=d.get('member'),status=d.get('status'),rating=String(d.get('rating'));if(!title)return;let f=films.find(f=>f.title.toLowerCase()===title.toLowerCase()&&(!d.get('year')||String(f.year)===String(d.get('year'))));if(!f){f={id:'local-'+Date.now(),title,year:Number(d.get('year'))||'',poster:'',genre:'',ratings:{},watchlist:[]};films.push(f)}if(status==='watched'){if(rating!=='')f.ratings[member]=Number(rating);f.watchlist=f.watchlist.filter(x=>x!==member)}else if(!f.watchlist.includes(member)&&!watched(f,member))f.watchlist.push(member);if(member==='Camden')storeCamdenOverride(f);saveListChange(f,member);addDialog.close();e.target.reset();render()});render();
async function loadCamden(){
 try{
  const response=await fetch('./data/camden.b64?v=3',{cache:'no-store'});if(!response.ok)throw Error('Data unavailable');
  const b64=(await response.text()).trim();
  const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
  const entries=JSON.parse(await new Response(stream).text());if(!Array.isArray(entries)||entries.length<200)throw Error('Import contains too few movies: '+entries.length);
  // Keep other members' records, but replace Camden's sample records with the real export.
  for(const f of films){delete f.ratings.Camden;f.watchlist=f.watchlist.filter(m=>m!=='Camden')}
  for(const [title,year,slug,rating] of entries){
   let f=films.find(x=>x.title.toLowerCase()===title.toLowerCase()&&Number(x.year)===year);
   if(!f){f={id:'lb-'+slug,title,year,poster:'',genre:'',ratings:{},watchlist:[],letterboxd:'https://boxd.it/'+slug};films.push(f)}
   f.letterboxd='https://boxd.it/'+slug;
   if(rating!==null){f.ratings.Camden=rating;f.watchlist=f.watchlist.filter(m=>m!=='Camden')}
   else if(!Object.hasOwn(f.ratings,'Camden')&&!f.watchlist.includes('Camden'))f.watchlist.push('Camden');
  }
  let edits=JSON.parse(localStorage.getItem('camdenEdits')||'{}');for(const f of films){let edit=edits[metaKey(f)];if(!edit)continue;if(edit.rating===null)delete f.ratings.Camden;else f.ratings.Camden=edit.rating;f.watchlist=f.watchlist.filter(m=>m!=='Camden');if(edit.watchlist)f.watchlist.push('Camden')}
  render();
  document.getElementById('importStatus')?.remove();
 }catch(e){console.error('Could not load Camden Letterboxd data',e);let el=document.getElementById('importStatus');if(!el){el=document.createElement('div');el.id='importStatus';document.querySelector('.wrap').prepend(el)}el.style.cssText='padding:14px;background:#532626;color:#fff;border-radius:8px;margin-bottom:12px';el.textContent='Camden import failed: '+e.message+' — please send this error to me.'}
}
if(LIVE_ENDPOINT){loadLive();setInterval(loadLive,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadLive()})}else loadCamden();
(function(){let pending=false;function updateTheater(){pending=false;const hero=document.querySelector('.homehero');if(!hero||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const rect=hero.getBoundingClientRect();const progress=Math.max(0,Math.min(1,-rect.top/Math.max(rect.height,1)));hero.style.setProperty('--theater-shift',Math.round(progress*110)+'px')}addEventListener('scroll',()=>{if(!pending){pending=true;requestAnimationFrame(updateTheater)}},{passive:true});addEventListener('resize',updateTheater);updateTheater()})();
async function loadFeaturedPosters(){for(const [title,year,key] of [['Hokum',2026,'Hokum'],['Hoppers',2026,'Jess']]){try{const response=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(title)+'&entity=movie&limit=25');const data=await response.json();const hit=data.results?.find(x=>x.trackName?.toLowerCase()===title.toLowerCase()&&new Date(x.releaseDate).getUTCFullYear()===year);if(!hit?.artworkUrl100)continue;externalPosters[key]=hit.artworkUrl100.replace(/100x100bb/g,'600x900bb');externalPosters[title.toLowerCase()+'-'+year]=externalPosters[key];render()}catch(e){console.warn('Featured poster lookup unavailable',e)}}}
loadFeaturedPosters();
async function fillMissingPosters(){const missing=films.filter(f=>!metadata[metaKey(f)]?.poster&&!f.poster&&!externalPosters[metaKey(f)]).slice(0,30);for(const f of missing){try{const res=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(f.title)+'&entity=movie&limit=20');const json=await res.json();const match=json.results?.find(x=>x.trackName?.toLowerCase()===f.title.toLowerCase()&&Math.abs(new Date(x.releaseDate).getUTCFullYear()-Number(f.year))<=1);if(match?.artworkUrl100){externalPosters[metaKey(f)]=match.artworkUrl100.replace(/100x100bb/g,'600x900bb');render()}}catch(e){console.warn('Poster search failed for',f.title)}}}setTimeout(fillMissingPosters,2500);
fetch('./data/movie-metadata.json?v=1',{cache:'no-store'}).then(r=>r.ok?r.json():{}).then(data=>{metadata=data;render()}).catch(console.warn);
</script></body></html>
